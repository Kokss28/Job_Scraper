name: 4. Harvest - Cloud & DevOps

on:
  schedule:
    # Runs every 4 hours at exact :00 Indian Standard Time (IST)
    # India (IST): 4:00 PM, 8:00 PM, 12:00 AM, 4:00 AM, 8:00 AM, 12:00 PM
    - cron: '35 2,6,10,14,18,22 * * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (verify schedule without web scraping)'
        required: false
        default: false
        type: boolean

jobs:
  harvest-cloud-devops:
    name: Harvest Cloud & DevOps Jobs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium Browser
        run: |
          playwright install chromium

      - name: Run Cloud & DevOps Harvest (Slot 3 - Past 4 Hours)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NAUKRI_HEADLESS: "true"
          PYTHONUNBUFFERED: "1"
        run: |
          DRY_ARG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_ARG="--dry-run"
          fi
          echo "Executing Slot 3: Cloud & DevOps..."
          python pipeline/automated_domain_extractor.py --slot 3 $DRY_ARG

      - name: Summary & Status
        if: always()
        run: |
          echo "### ☁️ Slot 3 Complete: Cloud & DevOps" >> $GITHUB_STEP_SUMMARY
          echo "Timestamp (UTC): $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "Keywords: cloud engineer, aws devops, azure engineer, kubernetes developer" >> $GITHUB_STEP_SUMMARY
          echo "Recency Window: Past 4 Hours" >> $GITHUB_STEP_SUMMARY
