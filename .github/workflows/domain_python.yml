name: 2. Harvest - Python Development

on:
  schedule:
    # Runs every 4 hours: 1, 5, 9, 13, 17, 21 UTC
    # Indian Standard Time (IST): 6:45 AM, 10:45 AM, 2:45 PM, 6:45 PM, 10:45 PM, 2:45 AM
    - cron: '15 1,5,9,13,17,21 * * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (verify schedule without web scraping)'
        required: false
        default: false
        type: boolean

jobs:
  harvest-python-development:
    name: Harvest Python Development Jobs
    runs-on: ubuntu-latest
    environment: CORN_JOBS
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium Browser & OS Dependencies
        run: |
          playwright install chromium --with-deps

      - name: Run Python Development Harvest (Slot 1 - Past 4 Hours)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NAUKRI_HEADLESS: "true"
          PYTHONUNBUFFERED: "1"
        run: |
          DRY_ARG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_ARG="--dry-run"
          fi
          echo "Executing Slot 1: Python Development..."
          python pipeline/automated_domain_extractor.py --slot 1 $DRY_ARG

      - name: Summary & Status
        if: always()
        run: |
          echo "### 🐍 Slot 1 Complete: Python Development" >> $GITHUB_STEP_SUMMARY
          echo "Timestamp (UTC): $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "Keywords: python developer, python backend, django developer, fastapi developer" >> $GITHUB_STEP_SUMMARY
          echo "Recency Window: Past 4 Hours" >> $GITHUB_STEP_SUMMARY
